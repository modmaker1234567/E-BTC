<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoLive Pro - Canlı Kripto Veri Analizi</title>
    <!-- Grafik Kütüphanesi -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #0c0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #161a25;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #2a2e39;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            font-weight: bold;
            font-size: 22px;
            color: #f0b90b;
        }
        .badge {
            background: #2b3139;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #929aa5;
        }
        .price-box {
            text-align: right;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .price {
            font-size: 32px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .change {
            font-size: 14px;
            font-weight: 500;
        }
        .up { color: #0ecb81; }
        .down { color: #f6465d; }
        
        /* Şifrenin girileceği gizli saat alanı */
        #secret-trigger {
            cursor: pointer;
            color: #474d57;
            font-size: 12px;
            user-select: none;
        }

        /* GİZLİ YÖNETİM PANELİ STİLLERİ */
        .admin-panel {
            display: none; 
            max-width: 1000px;
            margin: 20px auto 0 auto;
            background: #1e2330;
            border-radius: 8px;
            padding: 25px;
            border: 1px dashed #f0b90b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .admin-title {
            color: #f0b90b;
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid #2a2e39;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .admin-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-up { background-color: #0ecb81; color: white; }
        .btn-down { background-color: #f6465d; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <span class="logo">⚡ CryptoLive</span>
            <span class="badge">BTC / USDT</span>
            <span class="badge" style="color: #0ecb81;">● CANLI</span>
        </div>
        <div class="price-box">
            <div>
                <div id="btc-price" class="price up">$65,000.00</div>
                <div id="btc-change" class="change up">0.00%</div>
            </div>
            <!-- Şifre tetikleyici -->
            <div id="secret-trigger">Sistem Zamanı: 24:34</div>
        </div>
    </div>

    <!-- Finans Grafiği -->
    <div style="width:100%; height:420px;">
        <canvas id="cryptoChart"></canvas>
    </div>
</div>

<!-- GİZLİ YÖNETİM PANELİ -->
<div id="adminPanel" class="admin-panel">
    <h3 class="admin-title">🛠️ %100 Manuel Piyasa Manipülasyon Paneli</h3>
    <div class="admin-buttons">
        <button class="btn btn-up" onclick="triggerMove('up')">🔺 1 Adım YÜKSELT</button>
        <button class="btn btn-down" onclick="triggerMove('down')">🔻 1 Adım DÜŞÜR</button>
    </div>
</div>

<script>
    // Başlangıç Değerleri
    let currentPrice = 65000.00;
    let basePrice = 65000.00; 
    let pricesData = [];
    let labelsData = [];
    
    // Grafiği ilk başta düz bir çizgiyle başlat (Siz basana kadar düz kalır)
    for (let i = 20; i > 0; i--) {
        let timeStr = new Date(Date.now() - i * 5000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        labelsData.push(timeStr);
        pricesData.push(currentPrice);
    }

    // Chart.js Ayarları
    const ctx = document.getElementById('cryptoChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labelsData,
            datasets: [{
                label: 'BTC/USDT',
                data: pricesData,
                borderColor: '#0ecb81',
                borderWidth: 2,
                pointRadius: 0,
                fill: false,
                tension: 0.2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: '#2a2e39' }, ticks: { color: '#848e9c', maxTicksLimit: 8 } },
                y: { grid: { color: '#2a2e39' }, ticks: { color: '#848e9c' } }
            }
        }
    });

    // --- GİZLİ PANEL ŞİFRE SİSTEMİ (2434) ---
    let inputBuffer = "";
    const secretCode = "2434";

    window.addEventListener('keydown', (e) => {
        if (/[0-9]/.test(e.key)) {
            inputBuffer += e.key;
            if (inputBuffer.slice(-4) === secretCode) {
                document.getElementById('adminPanel').style.display = 'block';
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                inputBuffer = "";
            }
        }
    });

    document.getElementById('secret-trigger').addEventListener('click', () => {
        document.getElementById('adminPanel').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });


    // --- %100 MANUEL TETİKLEME FONKSİYONU ---
    // Sadece siz butona bastığınızda çalışır, zamanlayıcı (setInterval) kaldırılmıştır.
    function triggerMove(direction) {
        let changeAmount = 0;

        if (direction === 'up') {
            // Butona her basışta 400$ ile 900$ arası rastgele yükseltir
            changeAmount = Math.random() * 500 + 400; 
        } else if (direction === 'down') {
            // Butona her basışta 400$ ile 900$ arası rastgele düşürür
            changeAmount = -(Math.random() * 500 + 400); 
        }

        currentPrice += changeAmount;
        let percentChange = ((currentPrice - basePrice) / basePrice) * 100;

        // Sayısal Arayüzü Güncelle
        const priceEl = document.getElementById('btc-price');
        const changeEl = document.getElementById('btc-change');

        priceEl.innerText = "$" + currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        
        if (changeAmount >= 0) {
            priceEl.className = "price up";
            changeEl.className = "change up";
            changeEl.innerText = "+" + percentChange.toFixed(2) + "%";
            chart.data.datasets.borderColor = '#0ecb81';
        } else {
            priceEl.className = "price down";
            changeEl.className = "change down";
            changeEl.innerText = percentChange.toFixed(2) + "%";
            chart.data.datasets.borderColor = '#f6465d';
        }

        // Grafiği Sağa Doğru Kaydır (Yeni veri ekle, eskiyi sil)
        let nowStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        chart.data.labels.push(nowStr);
        chart.data.datasets.data.push(currentPrice);

        chart.data.labels.shift();
        chart.data.datasets.data.shift();

        // Çizimi yenile
        chart.update();
    }
</script>

</body>
</html>
